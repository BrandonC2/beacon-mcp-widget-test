<!doctype html>
<html>
<body class="bcn-body">

<div id="bcn-wrap" class="bcn-wrap">
  <div class="bcn-header">
    <span id="bcn-qname" class="bcn-qname"></span>
    <span id="bcn-qlabel" class="bcn-qlabel"></span>
  </div>
</div>

<style>
  :root {
    --bcn-bg: #FFFFFF;
    --bcn-border: #E5E7EB;
    --bcn-text-primary: #111827;
    --bcn-text-body: #374151;
    --bcn-gradient: linear-gradient(to right, #4A9FFF, #7C3AED);
    --bcn-blue: #4A9FFF;
    --bcn-error: #DC2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bcn-bg: #111827;
      --bcn-border: #374151;
      --bcn-text-primary: #F9FAFB;
      --bcn-text-body: #E5E7EB;
      --bcn-error: #F87171;
    }
  }
  html, .bcn-body { margin:0; padding:0; background:var(--color-background-primary, var(--bcn-bg)); display:block; }
  .bcn-wrap {
    border-radius:12px;
    background:var(--bcn-bg);
    color:var(--bcn-text-body);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    border:1px solid var(--bcn-border);
    overflow:clip;
    min-width:280px;
    max-width:640px;
  }
  .bcn-wrap::before {
    content:'';
    display:block;
    height:3px;
    background:var(--bcn-gradient);
  }
  .bcn-header {
    padding:16px 20px;
    background:var(--bcn-bg);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .bcn-qname {
    font-size:11px;
    font-weight:600;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    color:var(--bcn-blue);
    background:rgba(74,159,255,.08);
    border:1px solid rgba(74,159,255,.25);
    border-radius:4px;
    padding:2px 8px;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .bcn-qlabel {
    font-size:14px;
    font-weight:500;
    color:var(--bcn-text-primary);
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>

<script type="module" src="./prepare_query.js"></script>
</body>
</html>
