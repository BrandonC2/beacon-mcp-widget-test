<!doctype html>
<html>
<body class="bcn-body">

<div id="bcn-wrap" class="bcn-wrap">
  <div class="bcn-header">
    <span class="bcn-badge">EXECUTED</span>
    <span id="bcn-title" class="bcn-title"></span>
    <button id="bcn-recipe-btn" class="bcn-recipe-btn" style="display:none;">Details</button>
  </div>
  <div id="bcn-table-wrap" style="overflow-x:auto;overflow-y:auto;max-height:320px;">
    <table id="bcn-table" class="bcn-table">
      <thead id="bcn-thead"></thead>
      <tbody id="bcn-tbody"></tbody>
    </table>
    <div id="bcn-empty" class="bcn-empty" style="display:none;">No results.</div>
  </div>
  <div id="bcn-recipe" class="bcn-recipe" style="display:none;"></div>
</div>

<style>
  :root {
    --bcn-bg: #FFFFFF;
    --bcn-surface: #F9FAFB;
    --bcn-border: #E5E7EB;
    --bcn-divider: #F3F4F6;
    --bcn-text-primary: #111827;
    --bcn-text-body: #374151;
    --bcn-text-muted: #6B7280;
    --bcn-text-subtle: #9CA3AF;
    --bcn-scrollbar: #D1D5DB;
    --bcn-scrollbar-hover: #9CA3AF;
    --bcn-gradient: linear-gradient(to right, #4A9FFF, #7C3AED);
    --bcn-row-hover: linear-gradient(to right, rgba(74,159,255,.04), rgba(124,58,237,.04));
    --bcn-blue: #4A9FFF;
    --bcn-error: #DC2626;
    --bcn-chip-bg: #FFFFFF;
    --bcn-chip-badge-bg: #F3F4F6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bcn-bg: #111827;
      --bcn-surface: #1F2937;
      --bcn-border: #374151;
      --bcn-divider: #1F2937;
      --bcn-text-primary: #F9FAFB;
      --bcn-text-body: #E5E7EB;
      --bcn-text-muted: #9CA3AF;
      --bcn-text-subtle: #6B7280;
      --bcn-scrollbar: #374151;
      --bcn-scrollbar-hover: #4B5563;
      --bcn-row-hover: linear-gradient(to right, rgba(74,159,255,.07), rgba(124,58,237,.07));
      --bcn-blue: #4A9FFF;
      --bcn-error: #F87171;
      --bcn-chip-bg: #1F2937;
      --bcn-chip-badge-bg: #374151;
    }
  }
  html, body { overflow:hidden; }
  .bcn-body { margin:0; padding:0; background:var(--bcn-bg); display:block; }
  .bcn-wrap {
    border-radius:12px;
    background:var(--bcn-bg);
    color:var(--bcn-text-body);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    border:1px solid var(--bcn-border);
    overflow:clip;
    width:100%;
    max-width:900px;
  }
  .bcn-wrap::before {
    content:'';
    display:block;
    height:3px;
    background:var(--bcn-gradient);
  }
  .bcn-header {
    padding:16px 20px;
    background:var(--bcn-bg);
    border-bottom:1px solid var(--bcn-border);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .bcn-badge {
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    border-radius:4px;
    padding:2px 7px;
    border:1px solid var(--bcn-border);
    background:var(--bcn-gradient);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    white-space:nowrap;
  }
  .bcn-title { font-size:14px; font-weight:600; color:var(--bcn-text-primary); flex:1; }
  .bcn-recipe-btn {
    font-size:13px;
    font-weight:500;
    color:var(--bcn-text-muted);
    background:var(--bcn-bg);
    border:1px solid var(--bcn-border);
    border-radius:8px;
    padding:6px 14px;
    cursor:pointer;
    transition:all 0.2s ease;
    white-space:nowrap;
    font-family:inherit;
  }
  .bcn-recipe-btn:hover { background:var(--bcn-surface); border-color:#D1D5DB; }
  .bcn-recipe-btn:active { background:var(--bcn-divider); }
  .bcn-table { width:100%; border-collapse:collapse; font-size:13px; }
  .bcn-table th {
    padding:10px 12px;
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--bcn-text-muted);
    border-bottom:1px solid var(--bcn-border);
    white-space:nowrap;
    position:sticky;
    top:0;
    background:var(--bcn-bg);
    z-index:1;
    cursor:pointer;
    user-select:none;
    transition:color 0.15s ease;
  }
  .bcn-table th:hover { color:var(--bcn-text-body); }
  .bcn-table th.bcn-sort-active { color:var(--bcn-blue); }
  .bcn-sort-icon { font-size:9px; margin-left:4px; opacity:0.5; }
  .bcn-sort-active .bcn-sort-icon { opacity:1; }
  .bcn-table td {
    padding:9px 12px;
    border-bottom:1px solid var(--bcn-divider);
    color:var(--bcn-text-body);
    white-space:nowrap;
  }
  .bcn-table tr:last-child td { border-bottom:none; }
  .bcn-table tr:hover td { background:var(--bcn-row-hover); }
  .bcn-empty { padding:20px; color:var(--bcn-text-subtle); font-size:13px; text-align:center; }
  .bcn-recipe {
    border-top:1px solid var(--bcn-border);
    background:var(--bcn-surface);
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .bcn-recipe-section {
    border:1px solid var(--bcn-border);
    border-radius:12px;
    overflow:hidden;
    background:var(--bcn-bg);
  }
  .bcn-recipe-label {
    font-size:13px;
    font-weight:600;
    color:var(--bcn-text-primary);
    padding:12px 16px;
    border-bottom:1px solid var(--bcn-border);
  }
  .bcn-recipe-items { padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; }
  .bcn-recipe-item {
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:0 12px;
    height:32px;
    background:var(--bcn-surface);
    border:1px solid var(--bcn-border);
    border-radius:6px;
    font-size:13px;
    color:var(--bcn-text-body);
  }
  .bcn-recipe-item-dir { color:var(--bcn-blue); font-size:10px; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--bcn-surface); }
  ::-webkit-scrollbar-thumb { background:var(--bcn-scrollbar); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--bcn-scrollbar-hover); }
  ::-webkit-scrollbar-corner { background:var(--bcn-surface); }
</style>

<script>
  var _rows = [];
  var _cols = [];
  var _numericCol = {};
  var _colDecimals = {};
  var _sortCol = null;
  var _sortAsc = true;
  var _recipeOpen = false;
  var _recipeSortsEl = null;
  var _originalSorts = [];

  function operatorAbbrev(op) {
    var map = {
      "Equals": "=", "Not Equals": "≠",
      "Greater Than": ">", "Less Than": "<",
      "Greater Than or Equal": "≥", "Less Than or Equal": "≤",
      "Contains": "~", "Not Contains": "!~",
      "In List": "∈", "Not In List": "∉",
      "Between": "↔"
    };
    return map[op] || (op ? op.substring(0, 2) : "?");
  }

  function sortedRows() {
    if (_sortCol === null) return _rows;
    var col = _sortCol, asc = _sortAsc;
    return _rows.slice().sort(function(a, b) {
      var av = a[col], bv = b[col];
      if (_numericCol[col]) {
        var an = (av === null || av === undefined || av === "") ? 0 : (typeof av === "number" ? av : parseFloat(String(av).replace(/,/g, "")));
        var bn = (bv === null || bv === undefined || bv === "") ? 0 : (typeof bv === "number" ? bv : parseFloat(String(bv).replace(/,/g, "")));
        return asc ? an - bn : bn - an;
      }
      var as = String(av === null || av === undefined ? "" : av);
      var bs = String(bv === null || bv === undefined ? "" : bv);
      return asc ? as.localeCompare(bs) : bs.localeCompare(as);
    });
  }

  function renderTbody() {
    var tbody = document.getElementById("bcn-tbody");
    tbody.innerHTML = "";
    sortedRows().forEach(function(row) {
      var tr = document.createElement("tr");
      _cols.forEach(function(c) {
        var td = document.createElement("td");
        var v = row[c];
        if (_numericCol[c] && v !== null && v !== undefined && v !== "") {
          var n = typeof v === "number" ? v : parseFloat(String(v).replace(/,/g, ""));
          td.textContent = isNaN(n) ? String(v) : n.toFixed(_colDecimals[c]);
          td.style.textAlign = "right";
          td.style.fontVariantNumeric = "tabular-nums";
        } else {
          td.textContent = (v === null || v === undefined) ? "" : String(v);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function makeItem(text, dir) {
    var item = document.createElement("div");
    item.className = "bcn-recipe-item";
    if (dir) {
      var d = document.createElement("span");
      d.className = "bcn-recipe-item-dir";
      d.textContent = dir;
      item.appendChild(d);
    }
    item.appendChild(document.createTextNode(text));
    return item;
  }

  function syncRecipeSorts() {
    if (!_recipeSortsEl) return;
    _recipeSortsEl.innerHTML = "";
    var sorts = _sortCol !== null
      ? [{ field: _sortCol, direction: _sortAsc ? "Ascending" : "Descending" }]
      : _originalSorts;
    if (sorts.length === 0) {
      var none = makeItem("none");
      none.style.color = "var(--bcn-text-subtle)";
      _recipeSortsEl.appendChild(none);
      return;
    }
    sorts.forEach(function(s) {
      _recipeSortsEl.appendChild(makeItem(s.field, s.direction === "Ascending" ? "▲" : "▼"));
    });
  }

  function updateSortHeaders() {
    document.querySelectorAll("#bcn-thead th").forEach(function(th) {
      var col = th.dataset.col;
      var icon = th.querySelector(".bcn-sort-icon");
      var isActive = col === _sortCol;
      th.classList.toggle("bcn-sort-active", isActive);
      if (icon) icon.textContent = isActive ? (_sortAsc ? "▲" : "▼") : "";
    });
    syncRecipeSorts();
  }

  function toggleRecipe() {
    _recipeOpen = !_recipeOpen;
    var wrap = document.getElementById("bcn-wrap");
    var tableWrap = document.getElementById("bcn-table-wrap");
    var recipe = document.getElementById("bcn-recipe");
    var btn = document.getElementById("bcn-recipe-btn");
    btn.textContent = _recipeOpen ? "Results" : "Details";
    wrap.style.minHeight = wrap.offsetHeight + "px";
    (_recipeOpen ? tableWrap : recipe).style.display = "none";
    (_recipeOpen ? recipe : tableWrap).style.display = "";
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        wrap.style.minHeight = "";
      });
    });
  }

  function renderRecipeSection(container, label, texts) {
    var section = document.createElement("div");
    section.className = "bcn-recipe-section";
    var lbl = document.createElement("div");
    lbl.className = "bcn-recipe-label";
    lbl.textContent = label;
    section.appendChild(lbl);
    var items = document.createElement("div");
    items.className = "bcn-recipe-items";
    texts.forEach(function(t) { items.appendChild(makeItem(t.text, t.dir || null)); });
    section.appendChild(items);
    container.appendChild(section);
  }

  function renderRecipe(recipe, container) {
    if (recipe.parameters && recipe.parameters.length > 0) {
      renderRecipeSection(container, "Parameters",
        recipe.parameters.map(function(p) { return { text: p.name + ": " + p.value }; }));
    }
    if (recipe.rows && recipe.rows.length > 0) {
      renderRecipeSection(container, "Rows",
        recipe.rows.map(function(r) { return { text: r.field }; }));
    }
    if (recipe.columns && recipe.columns.length > 0) {
      renderRecipeSection(container, "Columns",
        recipe.columns.map(function(c) { return { text: c.field }; }));
    }
    if (recipe.filters && recipe.filters.length > 0) {
      renderRecipeSection(container, "Filters",
        recipe.filters.map(function(f) {
          return { text: f.field + " " + operatorAbbrev(f.operator) + " " + f.value };
        }));
    }

    _originalSorts = (recipe.sorts || []).map(function(s) {
      return { field: s.field, direction: s.direction };
    });
    var sortsSection = document.createElement("div");
    sortsSection.className = "bcn-recipe-section";
    var sortsLbl = document.createElement("div");
    sortsLbl.className = "bcn-recipe-label";
    sortsLbl.textContent = "Sorted";
    sortsSection.appendChild(sortsLbl);
    _recipeSortsEl = document.createElement("div");
    _recipeSortsEl.className = "bcn-recipe-items";
    sortsSection.appendChild(_recipeSortsEl);
    container.appendChild(sortsSection);
    syncRecipeSorts();

    if (recipe.limit != null) {
      var section = document.createElement("div");
      section.className = "bcn-recipe-section";
      var lbl = document.createElement("div");
      lbl.className = "bcn-recipe-label";
      lbl.textContent = "Limit";
      var items = document.createElement("div");
      items.className = "bcn-recipe-items";
      items.appendChild(makeItem(recipe.limit.toLocaleString() + " rows"));
      section.appendChild(lbl);
      section.appendChild(items);
      container.appendChild(section);
    }
  }

  function render(output) {
    document.getElementById("bcn-title").textContent = output.query_title || "";

    var recipe = null;
    try {
      if (output.recipe_json) {
        recipe = typeof output.recipe_json === "string"
          ? JSON.parse(output.recipe_json)
          : output.recipe_json;
      }
    } catch(e) {}

    try {
      _rows = typeof output.result_json === "string"
        ? JSON.parse(output.result_json)
        : output.result_json;
    } catch(e) { _rows = []; }

    if (recipe && recipe.sorts && recipe.sorts.length > 0) {
      _sortCol = recipe.sorts[0].field;
      _sortAsc = recipe.sorts[0].direction !== "Descending";
    }

    if (!_rows || _rows.length === 0) {
      document.getElementById("bcn-empty").style.display = "block";
    } else {
      _cols = Object.keys(_rows[0]);

      // resolve _sortCol to actual column name (recipe field may lack currency suffix etc.)
      if (_sortCol !== null && _cols.indexOf(_sortCol) === -1) {
        var matched = _cols.find(function(c) { return c.indexOf(_sortCol) === 0 || _sortCol.indexOf(c) === 0; });
        if (matched) _sortCol = matched;
      }
      _cols.forEach(function(c) {
        var allNumeric = _rows.every(function(r) {
          var v = r[c];
          if (v === null || v === undefined || v === "") return true;
          return typeof v === "number" || (typeof v === "string" && v.trim() !== "" && isFinite(Number(v.replace(/,/g, ""))));
        }) && _rows.some(function(r) { return r[c] !== null && r[c] !== undefined && r[c] !== ""; });
        _numericCol[c] = allNumeric;
        if (allNumeric) {
          var maxDec = 0;
          _rows.forEach(function(r) {
            var v = r[c];
            if (v === null || v === undefined || v === "") return;
            var dot = String(v).indexOf(".");
            if (dot !== -1) maxDec = Math.max(maxDec, String(v).length - dot - 1);
          });
          _colDecimals[c] = maxDec;
        }
      });

      var thead = document.getElementById("bcn-thead");
      var hr = document.createElement("tr");
      _cols.forEach(function(c) {
        var th = document.createElement("th");
        th.dataset.col = c;
        if (_numericCol[c]) th.style.textAlign = "right";
        var label = document.createElement("span");
        label.textContent = c;
        var icon = document.createElement("span");
        icon.className = "bcn-sort-icon";
        th.appendChild(label);
        th.appendChild(icon);
        th.onclick = function() {
          if (_sortCol === c) {
            _sortAsc = !_sortAsc;
          } else {
            _sortCol = c;
            _sortAsc = true;
          }
          renderTbody();
          updateSortHeaders();
        };
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      updateSortHeaders();
      renderTbody();
    }

    if (recipe && Object.keys(recipe).length > 0) {
      var btn = document.getElementById("bcn-recipe-btn");
      btn.style.display = "";
      btn.onclick = toggleRecipe;
      renderRecipe(recipe, document.getElementById("bcn-recipe"));
    }
  }

  function check() {
    try {
      var output = window.openai && window.openai.toolOutput;
      if (!output) { setTimeout(check, 50); return; }
      render(output);
    } catch(e) {
      document.body.innerHTML = "<pre style='color:var(--bcn-error);padding:12px'>" + String(e.stack || e) + "</pre>";
    }
  }
  check();
</script>
</body>
</html>
