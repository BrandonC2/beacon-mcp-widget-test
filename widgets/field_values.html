<!doctype html>
<html>
<body class="bcn-body">

<div id="bcn-wrap" class="bcn-wrap">
  <div class="bcn-header">
    <span class="bcn-badge">FIELD VALUES</span>
    <span id="bcn-field" class="bcn-title"></span>
  </div>
  <div style="overflow-x:auto;">
    <table id="bcn-table" class="bcn-table">
      <thead id="bcn-thead"></thead>
      <tbody id="bcn-tbody"></tbody>
    </table>
    <div id="bcn-empty" class="bcn-empty" style="display:none;">No values found.</div>
  </div>
</div>

<style>
  :root {
    --bcn-bg: #FFFFFF; --bcn-surface: #F9FAFB; --bcn-border: #E5E7EB;
    --bcn-divider: #F3F4F6; --bcn-text-primary: #111827; --bcn-text-body: #374151;
    --bcn-text-muted: #6B7280; --bcn-scrollbar: #D1D5DB; --bcn-scrollbar-hover: #9CA3AF;
    --bcn-gradient: linear-gradient(to right, #4A9FFF, #7C3AED);
    --bcn-row-hover: linear-gradient(to right, rgba(74,159,255,.04), rgba(124,58,237,.04));
    --bcn-error: #DC2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bcn-bg: #111827; --bcn-surface: #1F2937; --bcn-border: #374151;
      --bcn-divider: #1F2937; --bcn-text-primary: #F9FAFB; --bcn-text-body: #E5E7EB;
      --bcn-text-muted: #9CA3AF; --bcn-scrollbar: #374151; --bcn-scrollbar-hover: #4B5563;
      --bcn-row-hover: linear-gradient(to right, rgba(74,159,255,.07), rgba(124,58,237,.07));
      --bcn-error: #F87171;
    }
  }
  html, .bcn-body { margin:0; padding:0; background:var(--color-background-primary, var(--bcn-bg)); display:block; }
  .bcn-wrap { border-radius:12px; background:var(--bcn-bg); color:var(--bcn-text-body); font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; border:1px solid var(--bcn-border); overflow:clip; min-width:280px; max-width:700px; }
  .bcn-wrap::before { content:''; display:block; height:3px; background:var(--bcn-gradient); }
  .bcn-header { padding:12px 20px; background:var(--bcn-surface); border-bottom:1px solid var(--bcn-border); display:flex; align-items:center; gap:10px; }
  .bcn-badge { font-size:10px; font-weight:700; letter-spacing:.08em; border-radius:4px; padding:2px 7px; border:1px solid var(--bcn-border); background:var(--bcn-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .bcn-title { font-size:13px; font-weight:600; color:var(--bcn-text-primary); }
  .bcn-table { width:100%; border-collapse:collapse; font-size:12px; }
  .bcn-table th { padding:8px 12px; text-align:left; font-size:11px; font-weight:600; color:var(--bcn-text-muted); border-bottom:1px solid var(--bcn-border); white-space:nowrap; letter-spacing:.04em; text-transform:uppercase; position:sticky; top:0; background:var(--bcn-surface); z-index:1; }
  .bcn-table td { padding:7px 12px; border-bottom:1px solid var(--bcn-divider); color:var(--bcn-text-body); white-space:nowrap; transition:all 0.15s ease; }
  .bcn-table tr:last-child td { border-bottom:none; }
  .bcn-table tr:hover td { background:var(--bcn-row-hover); }
  .bcn-empty { padding:14px 20px; color:var(--bcn-text-muted); font-size:12px; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--bcn-surface); }
  ::-webkit-scrollbar-thumb { background:var(--bcn-scrollbar); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--bcn-scrollbar-hover); }
  ::-webkit-scrollbar-corner { background:var(--bcn-surface); }
</style>
